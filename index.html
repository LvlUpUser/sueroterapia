        // --- COMPONENTE PRINCIPAL ---
        function SueroterapiaApp() {
            const [patient, setPatient] = useState({ name: '', age: '', sex: '', symptoms: '' });
            const [flags, setFlags] = useState({
                glp1: false,
                bipolar: false,
                antidepressants: false,
                glaucoma: false,
                hypotension: false,
                migraine: false,
                thyroid: false,
                siboMethane: false
            });
            const [selectedProtocol, setSelectedProtocol] = useState(null);
            const [activeSession, setActiveSession] = useState(0);
            const [showReport, setShowReport] = useState(false);
            const [showPlansModal, setShowPlansModal] = useState(false);
            const [printWithPrices, setPrintWithPrices] = useState(true);
            const [isListening, setIsListening] = useState(false); // Estado micrófono

            const textareaRef = useRef(null);

            // --- Lógica Micrófono ---
            const toggleMic = () => {
                if (!('webkitSpeechRecognition' in window)) {
                    alert("Tu navegador no soporta entrada de voz. Prueba con Chrome.");
                    return;
                }

                if (isListening) {
                    setIsListening(false);
                } else {
                    const recognition = new window.webkitSpeechRecognition();
                    recognition.lang = 'es-ES';
                    recognition.continuous = false;
                    recognition.interimResults = false;

                    recognition.onstart = () => setIsListening(true);
                    recognition.onend = () => setIsListening(false);
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setPatient(prev => ({ ...prev, symptoms: prev.symptoms + (prev.symptoms ? ' ' : '') + transcript }));
                    };
                    recognition.onerror = (e) => {
                        console.error(e);
                        setIsListening(false);
                        alert("Error en reconocimiento de voz.");
                    };
                    recognition.start();
                }
            };

            // --- Lógica Safety Update ---
            const getSafeSession = (session) => {
                if (!session) return null;
                let safeIngredients = [...session.ingredients];
                let warnings = [];
                let modified = false;

                if (flags.glp1) {
                    warnings.push("⚠️ GLP-1 ACTIVO: Riesgo náuseas/gastroparesia. Infusión Lenta.");
                    const hasVitC = safeIngredients.find(i => i.id === 'vitc' || i.name.includes("Vitamina C"));
                    if (hasVitC && hasVitC.qty >= 5) warnings.push("ALERTA GLP-1 + VIT C: Posible error glucómetro y efecto diurético. HIDRATAR.");
                    const hasNad = safeIngredients.find(i => i.id === 'nad');
                    if (hasNad) warnings.push("ALERTA GLP-1 + NAD+: Riesgo Hipoglucemia. VIGILAR.");
                }

                if (flags.bipolar || flags.antidepressants || flags.siboMethane) {
                    const hasTrip = safeIngredients.find(i => i.id === 'trip');
                    if (hasTrip) {
                        safeIngredients = safeIngredients.filter(i => i.id !== 'trip');
                        warnings.push(`TRIPTÓFANO RETIRADO.`);
                        modified = true;
                    }
                }

                if (flags.bipolar || flags.glaucoma) {
                    const hasNad = safeIngredients.find(i => i.id === 'nad');
                    if (hasNad) {
                         if (flags.bipolar) {
                            safeIngredients = safeIngredients.filter(i => i.id !== 'nad');
                            warnings.push("NAD+ RETIRADO (Contraindicado Bipolar).");
                            modified = true;
                         } else {
                             warnings.push("ALERTA NAD+: Precaución Glaucoma.");
                         }
                    }
                }

                if (flags.hypotension) {
                    const hasVasodilator = safeIngredients.find(i => i.id === 'arginina' || i.id === 'procaina');
                    if (hasVasodilator) warnings.push("ALERTA HIPOTENSIÓN: Vigilar TA.");
                }
                
                if (flags.migraine) {
                     const hasVitC = safeIngredients.find(i => (i.id === 'vitc') && i.qty >= 15);
                     if (hasVitC) warnings.push("ALERTA MIGRAÑA: Vit C alta dosis. Lento.");
                }

                return { ...session, ingredients: safeIngredients, warnings, modified };
            };

            const safeProtocol = useMemo(() => {
                if (!selectedProtocol) return null;
                const safeSessions = selectedProtocol.sessions.map(s => getSafeSession(s));
                return { ...selectedProtocol, sessions: safeSessions };
            }, [selectedProtocol, flags]);

            const currentSession = safeProtocol ? safeProtocol.sessions[activeSession] : null;

            const calculateSessionCost = (session) => {
                if (!session) return 0;
                const ingredientsCost = session.ingredients.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
                return (ingredientsCost + session.base.price + PRICES.fungible);
            };

            const searchProtocol = () => {
                const text = patient.symptoms.toLowerCase();
                const match = PROTOCOLS_DB.map(p => ({
                    ...p, score: (p.target || []).filter(t => text.includes(t)).length
                })).sort((a,b) => b.score - a.score);
                if (match[0].score > 0) { setSelectedProtocol(match[0]); setActiveSession(0); }
                else alert("No se encontró coincidencia clara. Seleccione manual.");
            };

            const resetPatient = () => {
                setPatient({ name: '', age: '', sex: '', symptoms: '' });
                setFlags({ glp1: false, bipolar: false, antidepressants: false, glaucoma: false, hypotension: false, migraine: false, thyroid: false, siboMethane: false });
                setSelectedProtocol(null);
            };

            // --- VISTA IMPRESIÓN ---
            if (showReport && safeProtocol) {
                return (
                    <div className="min-h-screen bg-brand-dark/10 p-8 flex justify-center overflow-auto font-sans">
                        {/* Controles Flotantes */}
                        <div className="fixed top-4 right-4 flex flex-col gap-2 no-print z-50 items-end">
                            <div className="bg-white p-2 rounded-lg shadow-md flex items-center gap-2 border border-brand-primary/20">
                                <span className="text-xs font-bold text-brand-dark uppercase">¿Precios?</span>
                                <div className="relative inline-block w-10 align-middle select-none">
                                    <input type="checkbox" id="togglePrices" className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300 checked:right-0 checked:border-brand-primary transition-all duration-300"
                                        checked={printWithPrices} onChange={e => setPrintWithPrices(e.target.checked)}/>
                                    <label htmlFor="togglePrices" className={`toggle-label block overflow-hidden h-5 rounded-full cursor-pointer transition-colors duration-300 ${printWithPrices ? 'bg-brand-primary' : 'bg-gray-300'}`}></label>
                                </div>
                                <span className="text-xs text-brand-secondary">{printWithPrices ? 'Interno' : 'Paciente'}</span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowReport(false)} className="bg-brand-dark/20 text-brand-dark hover:bg-brand-dark/30 px-4 py-2 rounded font-medium backdrop-blur-sm">Cerrar</button>
                                <button onClick={() => window.print()} className="bg-brand-primary text-white px-4 py-2 rounded flex items-center gap-2 font-bold shadow-lg hover:bg-brand-primary/90">
                                    <Icon name="printer" className="h-5 w-5"/> Imprimir
                                </button>
                            </div>
                        </div>

                        <div id="print-section" className="bg-white w-[21cm] min-h-[29.7cm] p-12 shadow-2xl relative text-sm">
                            <div className="flex justify-between border-b-2 border-brand-primary pb-4 mb-6">
                                <div className="flex gap-4 items-center">
                                    <div className="bg-brand-primary text-white p-2 rounded-lg"><Icon name="droplet" className="h-8 w-8"/></div>
                                    <div>
                                        <h1 className="text-2xl font-serif font-bold text-brand-primary">4 ELEMENTS</h1>
                                        <p className="text-brand-accent font-bold tracking-widest text-[10px] uppercase">Wellness Medical Center</p>
                                    </div>
                                </div>
                                <div className="text-right text-brand-dark/60 text-xs">
                                    <p className="font-bold text-brand-primary">ORDEN DE TRATAMIENTO IV</p>
                                    <p>Fecha: {new Date().toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div className="bg-brand-bg p-4 rounded-lg border border-brand-secondary/20 mb-8">
                                <h3 className="text-xs font-bold text-brand-primary uppercase mb-2">Paciente</h3>
                                <p className="text-xl font-serif font-bold text-brand-dark capitalize">{patient.name || "Paciente"}</p>
                                {flags.glp1 && <p className="text-xs font-bold text-red-600 mt-2">⚠️ Tratamiento GLP-1 Activo</p>}
                            </div>
                            <h2 className="text-3xl font-serif font-bold text-brand-primary mb-2">{safeProtocol.name}</h2>
                            <p className="text-brand-secondary font-medium mb-6 flex items-center gap-2">{safeProtocol.element} | {safeProtocol.subtext}</p>
                            
                            {/* Renderizar TODAS las 3 sesiones en impresión */}
                            {safeProtocol.sessions.map((session, index) => (
                                <div key={index} className="break-inside-avoid mb-8 border border-brand-secondary/20 rounded-lg overflow-hidden">
                                    <div className="bg-brand-bg p-3 border-b border-brand-secondary/20 flex justify-between items-center">
                                        <h3 className="font-bold text-brand-primary">SESIÓN {index + 1}: {session.name}</h3>
                                        <div className="text-xs text-brand-dark/60">
                                            <span>Duración: <b>{session.duration}</b></span> | <span>Velocidad: <b>{session.speed}</b></span>
                                        </div>
                                    </div>
                                    {session.warnings.length > 0 && (
                                        <div className="bg-brand-accent/10 p-2 text-xs text-brand-accent border-b border-brand-accent/20">
                                            <strong>⚠ Alerta Seguridad:</strong> {session.warnings.join(' ')}
                                        </div>
                                    )}
                                    <table className="w-full text-xs">
                                        <thead>
                                            <tr className="bg-white text-brand-secondary border-b border-brand-bg">
                                                <th className="px-4 py-2 text-left w-1/2">Componente</th>
                                                <th className="px-4 py-2 text-right">Dosis</th>
                                                {printWithPrices && <th className="px-4 py-2 text-right">Coste</th>}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-brand-bg">
                                            <tr className="bg-brand-bg/30">
                                                <td className="px-4 py-2 font-medium">{session.base.name}</td>
                                                <td className="px-4 py-2 text-right">{session.base.qty} ml</td>
                                                {printWithPrices && <td className="px-4 py-2 text-right text-brand-dark/40">{session.base.price.toFixed(2)}€</td>}
                                            </tr>
                                            {session.ingredients.map((ing, i) => (
                                                <tr key={i}>
                                                    <td className="px-4 py-2">{ing.name}</td>
                                                    <td className="px-4 py-2 text-right font-bold">{ing.qty} ml</td>
                                                    {printWithPrices && <td className="px-4 py-2 text-right text-brand-dark/40">{(ing.price * ing.qty).toFixed(2)}€</td>}
                                                </tr>
                                            ))}
                                            {printWithPrices && (
                                                <tr className="bg-brand-bg font-bold text-brand-primary">
                                                    <td className="px-4 py-2" colSpan="2">Coste Sesión</td>
                                                    <td className="px-4 py-2 text-right">{calculateSessionCost(session).toFixed(2)} €</td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // --- VISTA PRINCIPAL ---
            return (
                <div className="min-h-screen bg-brand-bg pb-12 font-sans text-brand-dark relative">
                    {/* MODAL PLANES (1-7 Ordenados) */}
                    {showPlansModal && (
                        <div className="fixed inset-0 bg-brand-dark/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-xl shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto">
                                <div className="sticky top-0 bg-brand-primary text-white p-6 flex justify-between items-center z-10">
                                    <div>
                                        <h2 className="font-serif font-bold text-2xl">Planes de Longevidad</h2>
                                        <p className="text-xs opacity-80 uppercase tracking-widest">Guía de Referencia 1-7</p>
                                    </div>
                                    <button onClick={() => setShowPlansModal(false)} className="hover:bg-white/20 p-2 rounded-full transition"><Icon name="close" className="h-6 w-6"/></button>
                                </div>
                                <div className="p-8 grid md:grid-cols-2 gap-6">
                                    {LONGEVITY_PLANS_INFO.map(plan => (
                                        <div key={plan.id} className="bg-brand-bg/20 p-6 rounded-xl border border-brand-secondary/10 hover:border-brand-primary/30 transition relative overflow-hidden">
                                            <div className="absolute top-0 right-0 bg-brand-secondary/10 text-brand-secondary font-bold text-[100px] leading-none opacity-20 -mr-4 -mt-4 pointer-events-none">{plan.id}</div>
                                            <h3 className="font-bold text-brand-primary text-lg mb-2 relative z-10">{plan.name}</h3>
                                            <p className="text-sm text-brand-dark/80 mb-4 italic relative z-10">{plan.focus}</p>
                                            <div className="flex flex-wrap gap-2 relative z-10">
                                                {plan.target.map((t,i) => <span key={i} className="text-[10px] bg-white border border-brand-secondary/20 px-2 py-1 rounded uppercase text-brand-secondary font-bold">{t}</span>)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-brand-primary text-white sticky top-0 z-40 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Icon name="leaf" className="h-6 w-6 text-brand-secondary text-white"/>
                                <div>
                                    <h1 className="font-serif font-bold text-lg leading-none tracking-tight">4 ELEMENTS</h1>
                                    <p className="text-xs text-white/80 font-medium tracking-widest uppercase">Sistema Inteligente v10.4</p>
                                </div>
                            </div>
                            <button onClick={() => setShowPlansModal(true)} className="bg-white/10 hover:bg-white/20 text-xs px-4 py-2 rounded-full font-bold uppercase tracking-wider flex items-center gap-2 transition">
                                <Icon name="book" className="h-4 w-4"/> Ver Planes (1-7)
                            </button>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto p-4 grid lg:grid-cols-12 gap-6 mt-6">
                        {/* LEFT PANEL */}
                        <div className="lg:col-span-4 space-y-4">
                            {/* Paciente */}
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-brand-primary/10">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="font-bold text-brand-primary flex gap-2 items-center text-sm uppercase tracking-wide"><Icon name="user" className="h-5 w-5"/> Paciente</h2>
                                    <button onClick={resetPatient} className="text-brand-accent/60 hover:text-brand-accent transition-colors"><Icon name="trash" className="h-4 w-4"/></button>
                                </div>
                                <div className="space-y-3">
                                    <input type="text" placeholder="Nombre completo" className="w-full p-3 bg-brand-bg/30 border border-brand-secondary/20 rounded text-sm outline-none focus:ring-1 focus:ring-brand-primary" value={patient.name} onChange={e=>setPatient({...patient, name:e.target.value})}/>
                                    <div className="flex gap-2">
                                        <input type="number" placeholder="Edad" className="w-1/3 p-3 bg-brand-bg/30 border border-brand-secondary/20 rounded text-sm outline-none focus:ring-1 focus:ring-brand-primary" value={patient.age} onChange={e=>setPatient({...patient, age:e.target.value})}/>
                                        <select className="w-2/3 p-3 bg-brand-bg/30 border border-brand-secondary/20 rounded text-sm text-brand-dark outline-none focus:ring-1 focus:ring-brand-primary" value={patient.sex} onChange={e=>setPatient({...patient, sex:e.target.value})}>
                                            <option value="">Sexo</option><option>Mujer</option><option>Hombre</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            {/* Red Flags (CLICABLES) */}
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-brand-primary/10">
                                <h2 className="font-bold text-brand-primary flex gap-2 items-center mb-4 text-sm uppercase tracking-wide"><Icon name="shield" className="h-5 w-5 text-brand-accent"/> Safety Flags</h2>
                                <div className="space-y-2">
                                    {[
                                        {key: 'glp1', label: 'Tratamiento GLP-1 (Ozempic)'}, 
                                        {key: 'bipolar', label: 'Bipolaridad'},
                                        {key: 'antidepressants', label: 'Antidepresivos / ISRS'},
                                        {key: 'glaucoma', label: 'Glaucoma'},
                                        {key: 'hypotension', label: 'Hipotensión'},
                                        {key: 'migraine', label: 'Migraña'},
                                        {key: 'thyroid', label: 'Analítica Tiroidea'},
                                        {key: 'siboMethane', label: 'SIBO Metano'}
                                    ].map(flag => (
                                        <label key={flag.key} className={`flex items-center justify-between p-3 rounded cursor-pointer transition select-none ${flag.key === 'glp1' ? 'bg-red-50 border border-red-100 hover:bg-red-100' : 'hover:bg-brand-bg/30'}`}>
                                            <span className={`text-sm font-medium ${flag.key === 'glp1' ? 'text-red-700 font-bold' : 'text-brand-dark/80'}`}>{flag.label}</span>
                                            <input type="checkbox" className="w-5 h-5 text-brand-primary rounded border-gray-300 focus:ring-brand-primary cursor-pointer"
                                                checked={flags[flag.key]} onChange={e => setFlags({...flags, [flag.key]: e.target.checked})}/>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            {/* Buscador + Micrófono */}
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-brand-primary/10">
                                <div className="relative">
                                    <textarea ref={textareaRef} placeholder="Describe los síntomas..." className="w-full p-4 pr-12 bg-brand-bg/30 border border-brand-secondary/20 rounded-lg h-24 text-sm outline-none resize-none focus:ring-1 focus:ring-brand-primary" value={patient.symptoms} onChange={e=>setPatient({...patient, symptoms:e.target.value})}></textarea>
                                    <button onClick={toggleMic} className={`absolute top-2 right-2 p-2 rounded-full transition-all ${isListening ? 'bg-red-500 text-white mic-active' : 'text-brand-secondary hover:text-brand-primary bg-white/50'}`}>
                                        <Icon name="mic" className="h-5 w-5"/>
                                    </button>
                                </div>
                                <button onClick={searchProtocol} className="w-full mt-4 bg-brand-primary text-white py-3 rounded-lg font-bold shadow-lg shadow-brand-primary/20 hover:bg-brand-primary/90 transition flex justify-center items-center gap-2 text-sm tracking-wide">
                                    <Icon name="search" className="h-4 w-4"/> BUSCAR PROTOCOLO
                                </button>
                            </div>
                        </div>

                        {/* RIGHT PANEL */}
                        <div className="lg:col-span-8">
                            {safeProtocol ? (
                                <div className="bg-white rounded-xl shadow-lg border border-brand-primary/10 overflow-hidden fade-in min-h-[600px] flex flex-col">
                                    <div className="bg-brand-bg/30 p-8 border-b border-brand-secondary/10">
                                        <button onClick={() => setSelectedProtocol(null)} className="mb-4 flex items-center gap-2 text-brand-secondary hover:text-brand-primary text-xs font-bold uppercase tracking-wider"><Icon name="arrowLeft" className="h-4 w-4"/> Volver</button>
                                        <h2 className="text-3xl font-serif font-bold text-brand-primary mb-1">{safeProtocol.name}</h2>
                                        <p className="text-brand-accent font-medium italic">{safeProtocol.subtext}</p>
                                    </div>
                                    
                                    <div className="p-8 flex-grow">
                                        <div className="flex gap-2 mb-8 overflow-x-auto pb-2">
                                            {safeProtocol.sessions.map((s, idx) => (
                                                <button key={idx} onClick={() => setActiveSession(idx)} className={`whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold transition-all ${activeSession === idx ? 'bg-brand-primary text-white shadow-md' : 'bg-brand-bg text-brand-dark/60'}`}>SESIÓN {idx + 1}</button>
                                            ))}
                                        </div>
                                        
                                        <h3 className="text-xl font-serif font-bold text-brand-dark mb-4">{currentSession.name}</h3>

                                        {currentSession.modified && (
                                            <div className="bg-brand-accent/5 border-l-4 border-brand-accent p-4 mb-6 rounded-r">
                                                <h3 className="text-sm font-bold text-brand-accent flex items-center gap-2"><Icon name="alert" className="h-4 w-4"/> Protocolo Modificado</h3>
                                                <ul className="list-disc list-inside mt-1 text-sm text-brand-warm space-y-1">
                                                    {currentSession.warnings.map((w,i) => <li key={i}>{w}</li>)}
                                                </ul>
                                            </div>
                                        )}

                                        <div className="bg-white border border-brand-secondary/20 rounded-xl overflow-hidden mb-6 shadow-sm">
                                            <table className="w-full text-sm">
                                                <thead className="bg-brand-bg/50 text-brand-secondary font-medium border-b border-brand-secondary/10">
                                                    <tr><th className="px-6 py-4 text-left">Componente</th><th className="px-6 py-4 text-right">Cantidad</th><th className="px-6 py-4 text-right">Coste</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-brand-bg">
                                                    <tr className="bg-brand-primary/5">
                                                        <td className="px-6 py-4 font-semibold text-brand-primary">{currentSession.base.name}</td>
                                                        <td className="px-6 py-4 text-right">{currentSession.base.qty} ml</td>
                                                        <td className="px-6 py-4 text-right">{(currentSession.base.price).toFixed(2)}€</td>
                                                    </tr>
                                                    {currentSession.ingredients.map((ing, i) => (
                                                        <tr key={i}><td className="px-6 py-4">{ing.name}</td><td className="px-6 py-4 text-right font-bold">{ing.qty} ml</td><td className="px-6 py-4 text-right">{(ing.price * ing.qty).toFixed(2)}€</td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                        <button onClick={() => setShowReport(true)} className="bg-brand-primary text-white px-8 py-3 rounded-lg font-bold shadow-lg flex items-center gap-2 text-xs uppercase tracking-widest hover:bg-brand-primary/90 ml-auto">
                                            <Icon name="printer" className="h-4 w-4"/> Generar Orden PDF
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {PROTOCOLS_DB.map(p => (
                                        <button key={p.id} onClick={() => setSelectedProtocol(p)} className="bg-white p-6 rounded-xl border border-brand-primary/5 hover:border-brand-primary hover:shadow-xl transition-all text-left group">
                                            <span className="text-lg font-serif font-bold text-brand-dark block mb-1 group-hover:text-brand-primary">{p.name}</span>
                                            <span className="text-xs text-brand-accent font-medium uppercase tracking-wider">{p.subtext}</span>
                                            <div className="mt-2 flex gap-1">
                                                 <span className="text-[10px] bg-brand-bg px-2 py-1 rounded text-brand-dark/60 font-mono">3 Sesiones</span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SueroterapiaApp />);
    </script>
</body>
</html>
